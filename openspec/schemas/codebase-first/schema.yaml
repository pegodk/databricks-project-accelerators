name: codebase-first
version: 1
description: "Codebase-first workflow: proposals, technical designs, and
  implementation tasks; source code is the authoritative behavior definition."
artifacts:
  - id: proposal
    generates: proposal.md
    description: High-level description of the change, its motivation, and scope
    template: proposal.md
    requires: []
  - id: design
    generates: design.md
    description: Technical design decisions and implementation approach
    template: design.md
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    requires:
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
